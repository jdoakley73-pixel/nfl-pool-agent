name: Test NFL Pool Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/hidden-field-strategy
      - feature/pool-command-center
      - feature/mobile-tighten
      - feature/draft-command-center-v2
      - feature/draft-slot-11-command-center
      - fix/fantasy-player-feed-draft-ready
      - feature/sportsline-intelligence
      - feature/survivor-pick-tracking

jobs:
  test:
    runs-on: ubuntu-slim

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent test
        run: python test_agent.py

      - name: Run live schedule test
        run: python live_test.py

      - name: Run live odds test
        run: python live_odds_test.py

      - name: Run live NFL Pool Agent
        run: python live_agent.py

      - name: Run Survivor season planner
        run: python season_planner_test.py

      - name: Run weekly Survivor replanner
        run: python weekly_replanner.py

      - name: Run Survivor state test
        run: python survivor_state_test.py

      - name: Run Survivor control state test
        run: python survivor_control_state_test.py

      - name: Run pool strategy test
        run: python pool_strategy_test.py

      - name: Run ownership estimator test
        run: python ownership_estimator_test.py

      - name: Run hidden-field strategy test
        run: python hidden_field_strategy_test.py

      - name: Run fantasy rankings resilience test
        run: python fantasy_rankings_provider_test.py

      - name: Run SportsLine intelligence test
        run: python sportsline_intelligence_test.py

      - name: Compile dashboard modules
        run: python -m py_compile dashboard_service.py dashboard_app.py pages/Survivor_Control.py fantasy_gm.py fantasy_rankings_provider.py fantasy_draft_strategy.py sportsline_intelligence.py
