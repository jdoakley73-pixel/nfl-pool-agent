name: Test NFL Pool Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-slim 

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent test
        run: python test_agent.py
       
      - name: Run live schedule test
        run: python live_test.py
        
      - name: Run live odds test
        run: python live_odds_test.py
        
      - name: Run live NFL Pool Agent
        run: python live_agent.py
            
      - name: Run Survivor season planner
        run: python season_planner_test.py

      - name: Run weekly Survivor replanner
        run: python weekly_replanner.py

      - name: Run Survivor state test
        run: python survivor_state_test.py
